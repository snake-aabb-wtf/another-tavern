name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Assemble portable package
        run: |
          pnpm --filter @another-tavern/server deploy --legacy --prod ./release-pkg/app
          cp -r packages/web/dist ./release-pkg/app/web-dist
          cp -r packages/server/drizzle ./release-pkg/app/drizzle
          printf '@echo off\r\ncd /d %%~dp0app\r\nset STATIC_DIR=web-dist\r\nset OPEN_BROWSER=1\r\nnode dist/main.js\r\n' > ./release-pkg/start.cmd
          printf '#!/bin/sh\ncd "$(dirname "$0")/app"\nexport STATIC_DIR=web-dist\nexport OPEN_BROWSER=1\nnode dist/main.js\n' > ./release-pkg/start.sh
          chmod +x ./release-pkg/start.sh
      - name: Smoke test the package (clean-environment verification)
        run: |
          cd ./release-pkg/app
          echo "--- package layout ---"
          ls -la
          ls web-dist | head -5 || echo "web-dist MISSING"
          node dist/main.js > server.log 2>&1 &
          sleep 3
          echo "--- server log ---"
          cat server.log
          echo "--- health ---"
          curl -s -i http://localhost:3001/api/health || echo "health request failed"
          echo "--- root body ---"
          curl -s -i http://localhost:3001/ || echo "root request failed"
          echo "--- assert ---"
          curl -fsS http://localhost:3001/api/health > /dev/null
          curl -fsS -o /dev/null -w "web index: %{http_code}\n" http://localhost:3001/
      - name: Package zip
        run: |
          cd ./release-pkg
          zip -qr "another-tavern-${{ github.ref_name }}-node22.zip" .
      - name: Verify Dockerfile builds
        run: docker build -t another-tavern:ci .
      - uses: softprops/action-gh-release@v2
        with:
          files: another-tavern-*.zip
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
